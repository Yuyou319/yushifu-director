<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>Agnes 连接测试</title>
<style>
  body { font-family: system-ui, "Microsoft YaHei", sans-serif; max-width: 760px; margin: 40px auto; padding: 0 16px; color: #222; }
  h2 { margin-bottom: 4px; }
  .tip { color: #888; font-size: 13px; margin-bottom: 16px; }
  label { display: block; margin-top: 12px; font-weight: 600; }
  input { width: 100%; padding: 8px; box-sizing: border-box; margin-top: 4px; border: 1px solid #ccc; border-radius: 6px; }
  .btns { margin-top: 16px; }
  button { padding: 9px 16px; cursor: pointer; border: none; border-radius: 6px; background: #2d6cdf; color: #fff; margin-right: 8px; }
  button.alt { background: #555; }
  pre { background: #f5f5f5; padding: 12px; border-radius: 8px; white-space: pre-wrap; word-break: break-all; min-height: 60px; }
  .ok { color: #1a8a3c; } .err { color: #d33; }
</style>
</head>
<body>
  <h2>Agnes 连接测试（浏览器直连）</h2>
  <div class="tip">此页由浏览器直接请求 Agnes，不经过任何本地代理。Agnes 已开放 CORS，所以能跨域直连。仅供你自检 Key 与接口是否可用。</div>

  <label>API Key</label>
  <input id="key" placeholder="sk-..." value="" />

  <label>Base URL</label>
  <input id="base" value="https://api.agnes-ai.cn/v1" />

  <label>文本模型</label>
  <input id="tmodel" value="agnes-2.5-flash" />

  <label>生图模型</label>
  <input id="imodel" value="agnes-image-2.1-flash" />

  <div class="btns">
    <button onclick="testText()">测试文本</button>
    <button class="alt" onclick="testImage()">测试生图</button>
  </div>

  <pre id="out">结果会显示在这里…</pre>

  <script>
    const $ = (id) => document.getElementById(id).value.trim();
    const base = () => $.('base').replace(/\/+$/, '');
    const out = document.getElementById('out');

    async function post(path, model, body) {
      out.className = '';
      out.textContent = '请求中…';
      const res = await fetch(base() + path, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + $('key') },
        body: JSON.stringify(body)
      });
      const text = await res.text();
      let detail = text;
      try {
        const j = JSON.parse(text);
        detail = j.error && j.error.message
          || (j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content)
          || (j.data && j.data[0] && (j.data[0].url || j.data[0].b64_json))
          || j.message || text;
      } catch (e) {}
      out.className = res.ok ? 'ok' : 'err';
      out.textContent = (res.ok ? '✅ 成功 ' : '❌ 失败 ') + 'HTTP ' + res.status + '\n' + String(detail).slice(0, 600);
    }

    function testText() {
      return post('/chat/completions', $.('tmodel'), { model: $.('tmodel'), messages: [{ role: 'user', content: '你好' }], temperature: 0.7 });
    }
    function testImage() {
      return post('/images/generations', $.('imodel'), { model: $.('imodel'), prompt: '一只猫', n: 1, size: '1024x1024' });
    }
  </script>
</body>
</html>
